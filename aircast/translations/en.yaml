---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log details the add-on provides.
  address:
    name: Address
    description: >-
      Allows you to specify the IP address the AirCast server needs to
      bind to.
  latency_rtp:
    name: RTP Latency
    description: >-
      Allows you to tweak the buffering, which is needed when the audio is
      stuttering (e.g., low-quality network). This option specifies the number
      of ms the add-on has to buffer the RTP audio (AirPlay). Setting this value
      below 500ms is not recommended! Setting the value to 0 makes the add-on
      to get the value from AirPlay.
  latency_http:
    name: HTTP Latency
    description: >-
      Allows you to tweak the buffering, which is needed when the audio is
      stuttering (e.g., low-quality network). This option specifies the number
      of ms the add-on has to buffer the HTTP audio.
  drift:
    name: Drift
    description: >-
      Allow to let timing reference drift (no click).
  media_bridge_enabled:
    name: Enable media_player bridge
    description: >-
      When enabled, create AirPlay receivers for the media_player entities
      configured below and call media_player.play_media when AirPlay starts.
  players:
    name: Target media players
    description: >-
      Select one or more Home Assistant media_player entities (same as
      Developer Tools → Actions → media_player.play_media). Optional AirPlay
      name overrides the name shown on iPhone/Mac.
  media_content_type:
    name: media_content_type
    description: >-
      Value passed to media_player.play_media as media_content_type
      (usually "music").
  stream_format:
    name: Stream format
    description: >-
      HTTP stream format served to the target player. Use mp3 for XiaoAI
      speakers; wav may work for ESPHome and similar players.
