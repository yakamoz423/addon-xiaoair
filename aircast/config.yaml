---
name: XiaoAir
version: "0.1.20"
slug: xiaoair
description: AirPlay bridge to Home Assistant media_player entities (e.g. XiaoAI).
url: https://github.com/yakamoz423/addon-xiaoair
image: "ghcr.io/yakamoz423/{arch}-xiaoair"
startup: services
init: false
arch:
  - aarch64
  - amd64
hassio_api: true
homeassistant_api: true
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cast-audio
map:
  - addon_config:rw
  - homeassistant_config:rw
options:
  latency_rtp: 0
  latency_http: 0
  drift: false
  media_bridge_enabled: true
  airplay_name: XiaoAir
  media_content_type: music
  stream_format: mp3
  latency_offset_seconds: -2.0
  backend_buffer_seconds: 0.05
  silent_lead_in_seconds: 0.0
  audio_ready_bytes: 1024
  http_preroll_bytes: 4096
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  address: str?
  latency_rtp: int?
  latency_http: int?
  drift: bool?
  media_bridge_enabled: bool
  media_player: str?
  airplay_name: str
  media_content_type: str
  stream_format: list(mp3|wav)
  latency_offset_seconds: float
  backend_buffer_seconds: float
  silent_lead_in_seconds: float
  audio_ready_bytes: int
  http_preroll_bytes: int
