---
name: Build addon image

# Publish prebuilt images to GHCR so Home Assistant can pull instead of
# compiling on the appliance.
#
# Speed notes:
# - aarch64 runs on native ubuntu-24.04-arm (no QEMU).
# - Dockerfile keeps shairport compile above COPY rootfs, so script-only
#   changes reuse the cached compile layer via GHA/registry cache.

on:
  push:
    branches: [main]
    paths:
      - "aircast/**"
      - ".github/workflows/build-addon.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: meta
        run: |
          version="$(awk '/^version:/ { gsub(/"/,"",$2); print $2; exit }' aircast/config.yaml)"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${{ matrix.arch }}-xiaoair" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./aircast
          file: ./aircast/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_FROM=ghcr.io/hassio-addons/debian-base:9.1.0
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_NAME=XiaoAir
            BUILD_DESCRIPTION=AirPlay bridge to Home Assistant media_player
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          # GHA cache for same-arch runners + registry cache across runs.
          cache-from: |
            type=gha,scope=xiaoair-${{ matrix.arch }}
            type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=xiaoair-${{ matrix.arch }}
            type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
